<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saint Maron Maronite Catholic Church — South Philadelphia</title>
  <meta name="description" content="Saint Maron Maronite Catholic Church in South Philadelphia. Our new website is on its way.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    /* Same tokens as the full site: limestone, burgundy, brass gold. */
    :root {
      --stone: #f4f3ee;
      --burgundy: #6b2233;
      --burgundy-deep: #46151f;
      --gold: #b08a2e;
      --gold-soft: #d3b563;
      --display: "Marcellus", "Times New Roman", serif;
      --body: "Source Serif 4", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 22px;
      font-family: var(--body);
      font-size: 17px;
      line-height: 1.65;
      color: var(--stone);
      background: linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-deep) 100%);
      background-color: var(--burgundy-deep);
      position: relative;
      overflow: hidden;
    }

    /* Faint oversized arch echo, as on the main site's hero. */
    body::after {
      content: "";
      position: absolute;
      right: -160px;
      top: 30px;
      width: 520px;
      height: 720px;
      border: 1px solid rgba(211, 181, 99, 0.22);
      border-radius: 260px 260px 0 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 620px;
      text-align: center;
      animation: rise 0.7s ease both;
    }

    .crest { width: 74px; height: 74px; margin: 0 auto 26px; display: block; }

    h1 {
      font-family: var(--display);
      font-weight: 400;
      line-height: 1.15;
      font-size: clamp(2rem, 6vw, 3.1rem);
      color: var(--stone);
    }

    .place {
      font-family: var(--display);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 0.78rem;
      color: var(--gold-soft);
      margin-top: 14px;
    }

    .rule {
      width: 78px;
      height: 0;
      border: 0;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      padding-top: 3px;
      margin: 26px auto;
    }

    .lede { color: #e6d3d6; font-size: 1.05rem; }

    .soon {
      font-family: var(--display);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-size: 0.82rem;
      color: var(--gold-soft);
      margin-bottom: 18px;
    }

    .address {
      margin-top: 30px;
      font-size: 0.92rem;
      color: rgba(244, 243, 238, 0.75);
    }

    .blessing {
      margin-top: 22px;
      font-style: italic;
      color: var(--gold-soft);
      font-size: 0.95rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    @media (max-width: 560px) {
      body { font-size: 16px; }
      body::after { right: -260px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="crest" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 60 L8 26 A24 24 0 0 1 56 26 L56 60 Z" fill="#6b2233" stroke="#b08a2e" stroke-width="2"/>
      <g stroke="#d3b563" stroke-width="2.4" stroke-linecap="round">
        <line x1="32" y1="18" x2="32" y2="52"/>
        <path d="M32 24 L21 29 M32 24 L43 29" fill="none"/>
        <path d="M32 33 L18 39 M32 33 L46 39" fill="none"/>
        <path d="M32 42 L20 48 M32 42 L44 48" fill="none"/>
      </g>
    </svg>

    <p class="soon">Coming Soon</p>
    <h1>Saint Maron<br>Maronite Catholic Church</h1>
    <p class="place">South Philadelphia</p>

    <hr class="rule">

    <p class="lede">Our new parish website is on its way. Until then, all are welcome at the table of the Lord.</p>

    <p class="address">1013 Ellsworth Street &middot; Philadelphia, PA 19147</p>
    <p class="blessing">Peace be with you &middot; &#1587;&#1604;&#1575;&#1605; &#1604;&#1603;&#1605;</p>
  </main>
</body>
</html>
