<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parish News — Saint Maron Church, South Philadelphia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

        <span class="eyebrow" data-cms="header.eyebrow">Happening at Saint Maron</span>

      </div>
      <div id="all-news" class="news-grid"></div>
    </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>

    STM.renderChrome("news.html");
    STM.renderNews("all-news");
