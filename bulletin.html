<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Bulletin — Saint Maron Church, South Philadelphia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <section class="section">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow" data-cms="header.eyebrow">Read Along With Us</span>
        <h1 data-cms="header.heading">Weekly Bulletin</h1>
        <hr class="rule">
        <p class="lede" data-cms="header.lede">The parish bulletin is posted here each week with Mass intentions, announcements, and upcoming events. Open any bulletin below as a PDF.</p>
      </div>
      <div id="bulletins" class="bulletin-list"></div>
      <p style="margin-top:28px; color:var(--muted); font-size:0.92rem; font-style:italic;" data-cms="olderNote">Looking for an older bulletin? Contact the parish office and we will gladly send you a copy.</p>
    </div>
  </section>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    STM.renderChrome("bulletin.html");
    STM.renderBulletins("bulletins");
  </script>
</body>
</html>
