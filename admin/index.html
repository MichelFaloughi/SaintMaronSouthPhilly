<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Saint Maron — Parish Office</title>
  <!-- Sveltia CMS. Do not add type="module" to this tag; it breaks the CMS. -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <!-- The same color schemes and font pairings the public pages use. -->
  <script src="/theme-presets.js"></script>
  <script src="/text-styles.js"></script>
  <script>
    /* Live preview for the "Design > Colors & Fonts" entry.

       Sveltia's default preview only echoes the chosen option names. This
       replaces it with a sample of the home page (header, hero, Mass times,
       a section) drawn with the site's own stylesheet, so the priest can see
       what "Cinzel" or "Marian Blue" actually look like before saving.

       Sveltia exposes an HTM `html` tag bound to its own React, so this is
       a plain script: no build step, no dependencies. The preview is an
       iframe, so the stylesheets must be registered for it explicitly. */
    /* Titles are rich text now; the collapsed list summaries use
       {{fields.title | plain}} so they show the words without the tags. */
    CMS.registerStringTransformation("plain", function (value) {
      // DOMParser builds an inert document, so nothing in the value runs.
      var doc = new DOMParser().parseFromString(String(value == null ? "" : value), "text/html");
      return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
    });

    /* "Color & size": a few words in a chosen color and size, offered in
       every rich text field. Sveltia's editor cannot style a selection, so
       this is an inline chip: the priest types the words in a small dialog
       and picks from the preset lists in text-styles.js. It is saved as
       <span data-color data-size>, which app.js turns into classes. */
    (function () {
      var S = window.STM_TEXT_STYLES;
      function opts(list) { return list.map(function (o) { return { label: o.label, value: o.value }; }); }
      function find(list, v) { return list.filter(function (o) { return o.value === v; })[0]; }
      function build(values, forPreview) {
        var span = document.createElement("span");
        span.setAttribute("data-color", values.color || "");
        span.setAttribute("data-size", values.size || "");
        span.textContent = values.text || "";
        if (forPreview) {
          var c = find(S.colors, values.color), z = find(S.sizes, values.size);
          if (c && c.swatch) span.style.color = c.swatch;
          if (z && z.em) span.style.fontSize = z.em + "em";
        }
        return span;
      }
      CMS.registerEditorComponent({
        id: "styled-text",
        label: "Color & size",
        icon: "format_color_text",
        trigger: "button",
        mode: "dialog",
        fields: [
          { name: "text", label: "Words", widget: "string", hint: "Type the words to color or resize." },
          { name: "color", label: "Color", widget: "select", required: false, default: "", options: opts(S.colors) },
          { name: "size", label: "Size", widget: "select", required: false, default: "", options: opts(S.sizes) },
        ],
        // Markdown form, required by the API though these fields save HTML.
        pattern: /\[styled color="(?<color>\w*)" size="(?<size>\w*)"\](?<text>[^\[\]\n]*)\[\/styled\]/,
        toBlock: function (v) {
          return '[styled color="' + (v.color || "") + '" size="' + (v.size || "") + '"]' + String(v.text || "").replace(/[\[\]\n]/g, "") + "[/styled]";
        },
        htmlSelector: "span[data-color]",
        fromBlockHTML: function (el) {
          return { text: el.textContent || "", color: el.getAttribute("data-color") || "", size: el.getAttribute("data-size") || "" };
        },
        toBlockHTML: function (v) { return build(v, false); },
        toPreview: function (v) { return build(v, true); },
      });
    })();

    /* Live preview: the real website page, showing the unsaved draft.

       Each CMS entry maps to the page that displays it. The preview pane
       loads that page with ?cms-preview in an iframe and sends it the
       draft by postMessage (same origin only); app.js then draws the page
       from the draft with the same code as the live site, so what the
       priest sees here is what visitors will see. Photos chosen but not
       yet saved are passed as the temporary URLs the CMS holds for them. */
    (function () {
      var React = CMS.React;
      var TARGETS = {
        "news/items": { page: "news.html", path: "content/news.json" },
        "bulletins/items": { page: "bulletin.html", path: "content/bulletins.json" },
        "priests/items": { page: "index.html", path: "content/priests.json", scrollTo: "priests-band" },
        "design/theme": { page: "index.html", path: "content/theme.json" },
        "pages/home": { page: "index.html", path: "content/pages/home.json" },
        "pages/contact": { page: "contact.html", path: "content/pages/contact.json" },
        "pages/donate": { page: "donate.html", path: "content/pages/donate.json" },
        "pages/news-page": { page: "news.html", path: "content/pages/news.json" },
        "pages/bulletin-page": { page: "bulletin.html", path: "content/pages/bulletin.json" },
      };

      function withAssets(v, getAsset) {
        if (Array.isArray(v)) return v.map(function (x) { return withAssets(x, getAsset); });
        if (v && typeof v === "object") {
          var o = {};
          Object.keys(v).forEach(function (k) { o[k] = withAssets(v[k], getAsset); });
          return o;
        }
        if (typeof v === "string" && /^(blob:|\/?(images|bulletins)\/)/.test(v)) {
          var a = getAsset(v);
          if (a && a.url) return a.url;
        }
        return v;
      }

      function makePreview(file) {
        return function SitePreview(props) {
          var t = TARGETS[props.entry.get("collection") + "/" + file];
          var frame = React.useRef(null);
          var latest = React.useRef(null);
          var timer = React.useRef(0);
          var host = props.window || window;
          if (t) {
            latest.current = {
              type: "stm-preview",
              path: t.path,
              data: withAssets(props.entry.get("data").toJS(), props.getAsset),
              scrollTo: t.scrollTo || "",
            };
          }
          function send() {
            var w = frame.current && frame.current.contentWindow;
            if (w && latest.current) w.postMessage(latest.current, location.origin);
          }
          // The page says when it is ready; answer with the current draft.
          React.useEffect(function () {
            function onMessage(e) {
              if (!frame.current || e.source !== frame.current.contentWindow) return;
              if (e.origin !== location.origin || !e.data || e.data.type !== "stm-preview-ready") return;
              send();
            }
            host.addEventListener("message", onMessage);
            return function () { host.removeEventListener("message", onMessage); clearTimeout(timer.current); };
          }, [host]);
          // Every edit: send the new draft after a short pause in typing.
          React.useEffect(function () {
            clearTimeout(timer.current);
            timer.current = setTimeout(send, 250);
          });
          if (!t) return null;
          return html`<iframe
            ref=${frame}
            src=${"/" + t.page + "?cms-preview"}
            title="Preview of the website page"
            style=${{ position: "fixed", top: 0, left: 0, width: "100%", height: "100%", border: 0, display: "block", background: "#f4f3ee" }}
          />`;
        };
      }

      Object.keys(TARGETS).forEach(function (key) {
        var file = key.split("/")[1];
        if (file !== "items") CMS.registerPreviewTemplate(file, makePreview(file));
      });
      // News, bulletins, and priests all name their file "items"; one
      // template serves all three and picks the page by collection.
      CMS.registerPreviewTemplate("items", makePreview("items"));
    })();
  </script>
</head>
<body>
</body>
</html>
