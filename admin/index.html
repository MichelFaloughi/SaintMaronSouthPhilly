<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Saint Maron — Parish Office</title>
  <!-- Sveltia CMS. Do not add type="module" to this tag; it breaks the CMS. -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <!-- The same color schemes and font pairings the public pages use. -->
  <script src="/theme-presets.js"></script>
  <script>
    /* Live preview for the "Design > Colors & Fonts" entry.

       Sveltia's default preview only echoes the chosen option names. This
       replaces it with a sample of the home page (header, hero, Mass times,
       a section) drawn with the site's own stylesheet, so the priest can see
       what "Cinzel" or "Marian Blue" actually look like before saving.

       Sveltia exposes an HTM `html` tag bound to its own React, so this is
       a plain script: no build step, no dependencies. The preview is an
       iframe, so the stylesheets must be registered for it explicitly. */
    (function () {
      var PRESETS = window.STM_THEME;
      var DEFAULT_FONTS = "https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap";

      CMS.registerPreviewStyle("/styles.css", { collection: "design", file: "theme" });
      CMS.registerPreviewStyle("/admin/preview.css", { collection: "design", file: "theme" });

      function ThemePreview(props) {
        var entry = props.entry;
        var palette = PRESETS.PALETTES[entry.getIn(["data", "palette"])];
        var pair = PRESETS.FONT_PAIRS[entry.getIn(["data", "fonts"])];

        // CSS variables on the wrapper override the defaults from styles.css
        // for everything inside it, exactly as app.js does on the live site.
        var vars = "";
        if (palette) {
          Object.keys(palette).forEach(function (k) { vars += k + ":" + palette[k] + ";"; });
        }
        if (pair) {
          vars += "--display:" + pair.display + ";--body:" + pair.body + ";";
        }

        return html`
          <div class="theme-preview" style=${vars}>
            <link rel="stylesheet" href=${DEFAULT_FONTS} />
            ${pair ? html`<link rel="stylesheet" href=${PRESETS.fontsUrl(pair)} />` : null}
            <p class="preview-note">A sample of the home page in the chosen colors and lettering. Save to apply it to the whole site.</p>
            <header class="site-header">
              <div class="wrap">
                <div class="masthead">
                  <img class="crest" src="/images/logo.png" alt="" />
                  <div class="masthead-names">
                    <span class="name">Saint Maron Church</span>
                    <span class="place">Maronite Catholic · South Philadelphia</span>
                  </div>
                </div>
                <nav class="nav" aria-label="Sample navigation">
                  <a class="active">Home</a><a>Parish News</a><a>Weekly Bulletin</a><a>Contact</a><a>Donate</a>
                </nav>
              </div>
            </header>
            <section class="hero" data-key-path="palette" tabindex="0">
              <div class="wrap hero-grid">
                <div>
                  <span class="eyebrow">Est. 1892 · Eparchy of Saint Maron of Brooklyn</span>
                  <h1>Saint Maron<br />Maronite Catholic Church</h1>
                  <p class="lede">One of the first Maronite parishes in North America, at home in South Philadelphia since 1892. All are welcome at the table of the Lord.</p>
                  <div class="hero-actions">
                    <span class="btn primary">This Week's Bulletin</span>
                    <span class="btn ghost-light">Plan Your Visit</span>
                  </div>
                </div>
                <aside class="mass-card">
                  <h3>Divine Liturgy</h3>
                  <p class="sub">Celebrated in English, Arabic, and Syriac</p>
                  <dl>
                    <dt>Saturday Vigil</dt><dd>4:00 PM</dd>
                    <dt>Sunday</dt><dd>11:00 AM</dd>
                  </dl>
                </aside>
              </div>
            </section>
            <section class="section" data-key-path="fonts" tabindex="0">
              <div class="wrap">
                <span class="eyebrow">Our Parish</span>
                <h2>A Maronite home in the heart of the city</h2>
                <hr class="rule" />
                <p>Founded by Lebanese immigrants at the close of the nineteenth century, Saint Maron has been a spiritual home for generations of families in South Philadelphia. We worship in the ancient Maronite tradition, with a liturgy whose roots reach back to the earliest Christian communities of Antioch.</p>
                <p style="margin-top:12px"><em>Whether your family has been here for a hundred years or you are stepping inside for the first time, you belong here.</em> <strong>Mass times, news, and the weekly bulletin</strong> are always a tap away.</p>
              </div>
            </section>
          </div>
        `;
      }

      CMS.registerPreviewTemplate("theme", ThemePreview);
    })();
  </script>
</head>
<body>
</body>
</html>
