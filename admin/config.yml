# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration for the Saint Maron parish site.
#
# Content is stored as two JSON files that the site fetches at runtime. They are
# single files holding a list, rather than one file per entry, because the site
# has no build step: a browser cannot list a directory, so it must be able to
# fetch the whole collection in one request.

backend:
  name: github
  repo: MichelFaloughi/SaintMaronSouthPhilly
  branch: main
  # "Sign In with GitHub" goes through api/oauth.js, a Vercel function on the
  # same domain that holds the OAuth app's client secret. "Sign In Using
  # Access Token" still works as a fallback.
  base_url: https://www.saintmaronphilly.org
  auth_endpoint: api/oauth

# Photos uploaded for news items. Bulletin PDFs override this per field.
media_folder: images
public_folder: /images

collections:
  - name: news
    label: Parish News
    icon: newspaper
    files:
      - name: items
        label: News Items
        file: content/news.json
        description: Announcements, feasts, and events shown on the home page and the News page.
        fields:
          - label: News Items
            name: items
            widget: list
            required: false
            label_singular: News Item
            summary: '{{fields.date}} — {{fields.title}}'
            collapsed: true
            fields:
              - label: Title
                name: title
                widget: string

              - label: Date
                name: date
                widget: datetime
                format: 'YYYY-MM-DD'
                date_format: 'YYYY-MM-DD'
                time_format: false
                picker_utc: true
                hint: The newest date appears first on the site.

              - label: Text
                name: body
                widget: text
                hint: A short paragraph. Plain text — no formatting.

              - label: Photo
                name: image
                widget: image
                required: false
                hint: Optional. If left empty, a decorative illustration is used instead.

              - label: Photo description
                name: imageAlt
                widget: string
                required: false
                hint: Describes the photo for people using a screen reader. Only needed if you added a photo.

              - label: Illustration
                name: art
                widget: select
                required: false
                default: window
                options:
                  - { label: Church window, value: window }
                  - { label: Cedar tree, value: cedar }
                  - { label: Candles, value: candles }
                  - { label: Bells, value: bells }
                hint: Used only when there is no photo.

              - label: Button
                name: link
                widget: object
                required: false
                collapsed: true
                hint: Optional. Adds a button to the card, e.g. a sign-up form.
                fields:
                  - { label: Button text, name: label, widget: string, required: false, default: Learn more }
                  - { label: Link address, name: url, widget: string, required: false, hint: 'Paste the full address, starting with https://' }

  - name: bulletins
    label: Weekly Bulletin
    icon: description
    files:
      - name: items
        label: Bulletins
        file: content/bulletins.json
        description: The PDF bulletins listed on the Bulletin page.
        fields:
          - label: Bulletins
            name: items
            widget: list
            required: false
            label_singular: Bulletin
            summary: '{{fields.date}} — {{fields.title}}'
            collapsed: true
            fields:
              - label: Title
                name: title
                widget: string
                hint: For example "Sunday, 6 September 2026".

              - label: Date
                name: date
                widget: datetime
                format: 'YYYY-MM-DD'
                date_format: 'YYYY-MM-DD'
                time_format: false
                picker_utc: true

              - label: PDF
                name: file
                widget: file
                media_folder: /bulletins
                public_folder: /bulletins
                hint: Upload the bulletin PDF.

  # Every heading, paragraph, time, photo, and link between the site's header
  # and footer. The field names are a contract with the data-cms attributes in
  # the HTML pages; renaming one here breaks the overlay in app.js.
  - name: pages
    label: Site Pages
    icon: web
    files:
      - name: home
        label: Home Page
        file: content/pages/home.json
        description: All the text on the home page, including Mass times.
        fields:
          - label: Top Banner
            name: hero
            widget: object
            collapsed: true
            fields:
              - label: Small line above the title
                name: eyebrow
                widget: string
              - label: Page title
                name: heading
                widget: text
                hint: Line breaks are kept, so you can split the title over two lines.
              - label: Welcome paragraph
                name: lede
                widget: text
              - label: First button
                name: bulletinButton
                widget: string
                hint: The button that opens the Weekly Bulletin page.
              - label: Second button
                name: visitButton
                widget: string
                hint: The button that opens the Contact page.
          - label: Divine Liturgy Card
            name: liturgy
            widget: object
            collapsed: true
            fields:
              - label: Card title
                name: heading
                widget: string
              - label: Line under the title
                name: subtitle
                widget: string
              - label: Liturgy times
                name: times
                widget: list
                required: false
                label_singular: Liturgy time
                summary: '{{fields.service}} — {{fields.time}}'
                hint: One row per service. Add rows for holy days, remove them after.
                fields:
                  - { label: Service, name: service, widget: string, hint: 'For example "Saturday Vigil" or "Sunday".' }
                  - { label: Time, name: time, widget: string, hint: 'For example "4:00 PM".' }
          - label: Our Parish
            name: parish
            widget: object
            collapsed: true
            fields:
              - label: Small line above the title
                name: eyebrow
                widget: string
              - label: Section title
                name: heading
                widget: string
              - label: Photo
                name: photo
                widget: image
              - label: Photo description
                name: photoAlt
                widget: string
                hint: Describes the photo for people using a screen reader.
              - label: Caption under the photo
                name: caption
                widget: string
              - label: Parish story
                name: story
                widget: text
                hint: The history of the parish, in your own words.
              - label: Closing line
                name: storyMore
                widget: text
          - label: Parish News Section
            name: news
            widget: object
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string }
              - { label: Section title, name: heading, widget: string }
              - { label: Button, name: button, widget: string, hint: The button that opens the News page. }
          - label: Support Banner
            name: callout
            widget: object
            collapsed: true
            fields:
              - { label: Title, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button, name: button, widget: string, hint: The button that opens the Donate page. }

      - name: contact
        label: Contact Page
        file: content/pages/contact.json
        description: Phone, email, office hours, clergy, and directions.
        fields:
          - label: Page Heading
            name: header
            widget: object
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string }
              - { label: Page title, name: heading, widget: string }
              - { label: Welcome paragraph, name: lede, widget: text }
          - label: Parish Office
            name: office
            widget: object
            collapsed: true
            fields:
              - { label: Box title, name: heading, widget: string }
              - label: Address
                name: address
                widget: text
                hint: Line breaks are kept.
              - label: Phone
                name: phone
                widget: string
                hint: 'For example (215) 389-2000. The call link is made automatically.'
              - label: WhatsApp
                name: whatsapp
                widget: string
                hint: The WhatsApp link is made automatically from the number.
              - { label: Email, name: email, widget: string }
              - { label: Office hours, name: hours, widget: string }
          - label: Clergy
            name: clergy
            widget: object
            collapsed: true
            fields:
              - { label: Box title, name: heading, widget: string }
              - { label: Pastor, name: pastor, widget: string }
              - { label: Sacraments text, name: sacraments, widget: text }
              - { label: New to the parish text, name: newHere, widget: text }
          - label: Finding Us
            name: finding
            widget: object
            collapsed: true
            fields:
              - { label: Box title, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - label: Map address
                name: mapAddress
                widget: string
                hint: The map and the "Get directions" link both point at this address.

      - name: donate
        label: Donate Page
        file: content/pages/donate.json
        description: The giving options and their links.
        fields:
          - label: Page Heading
            name: header
            widget: object
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string }
              - { label: Page title, name: heading, widget: string }
              - { label: Welcome paragraph, name: lede, widget: text }
          - label: Zeffy Card
            name: zeffy
            widget: object
            collapsed: true
            fields:
              - { label: Card title, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button, name: button, widget: string }
              - { label: Donation link, name: url, widget: string, hint: 'Paste the full address, starting with https://' }
          - label: Venmo Card
            name: venmo
            widget: object
            collapsed: true
            fields:
              - { label: Card title, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button, name: button, widget: string }
              - { label: Donation link, name: url, widget: string, hint: 'Paste the full address, starting with https://' }

      - name: news-page
        label: News Page
        file: content/pages/news.json
        description: The heading above the list of news items.
        fields:
          - label: Page Heading
            name: header
            widget: object
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string }
              - { label: Page title, name: heading, widget: string }
              - { label: Welcome paragraph, name: lede, widget: text }

      - name: bulletin-page
        label: Bulletin Page
        file: content/pages/bulletin.json
        description: The heading above the list of bulletins.
        fields:
          - label: Page Heading
            name: header
            widget: object
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string }
              - { label: Page title, name: heading, widget: string }
              - { label: Welcome paragraph, name: lede, widget: text }
          - label: Older bulletins note
            name: olderNote
            widget: text
            hint: The italic line under the list of bulletins.
