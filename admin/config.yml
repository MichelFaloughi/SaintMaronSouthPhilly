# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration for the Saint Maron parish site.
#
# Content is stored as two JSON files that the site fetches at runtime. They are
# single files holding a list, rather than one file per entry, because the site
# has no build step: a browser cannot list a directory, so it must be able to
# fetch the whole collection in one request.

backend:
  name: github
  repo: MichelFaloughi/SaintMaronSouthPhilly
  branch: main
  # "Sign In with GitHub" goes through api/oauth.js, a Vercel function on the
  # same domain that holds the OAuth app's client secret. "Sign In Using
  # Access Token" still works as a fallback.
  base_url: https://www.saintmaronphilly.org
  auth_endpoint: api/oauth

# Photos uploaded for news items. Bulletin PDFs override this per field.
media_folder: images
public_folder: /images

collections:
  - name: news
    label: Parish News
    icon: newspaper
    files:
      - name: items
        label: News Items
        file: content/news.json
        description: Announcements, feasts, and events shown on the home page and the News page.
        fields:
          - label: News Items
            name: items
            widget: list
            required: false
            label_singular: News Item
            summary: '{{fields.date}} — {{fields.title | plain}}'
            collapsed: true
            fields:
              - label: Title
                name: title
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, align]
                editor_components: []
                hint: Select some words to make them bold or italic. The alignment button centers the title.

              - label: Date
                name: date
                widget: datetime
                format: 'YYYY-MM-DD'
                date_format: 'YYYY-MM-DD'
                time_format: false
                picker_utc: true
                hint: The newest date appears first on the site.

              - label: Text
                name: body
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, heading-three, bulleted-list, numbered-list, align]
                editor_components: []
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.

              - label: Photo
                name: image
                widget: image
                required: false
                hint: Optional. If left empty, a decorative illustration is used instead.

              - label: Photo description
                name: imageAlt
                widget: string
                required: false
                hint: Describes the photo for people using a screen reader. Only needed if you added a photo.

              - label: Illustration
                name: art
                widget: select
                required: false
                default: window
                options:
                  - { label: Church window, value: window }
                  - { label: Cedar tree, value: cedar }
                  - { label: Candles, value: candles }
                  - { label: Bells, value: bells }
                hint: Used only when there is no photo.

              - label: Button
                name: link
                widget: object
                required: false
                collapsed: true
                hint: Optional. Adds a button to the card, e.g. a sign-up form.
                fields:
                  - { label: Button text, name: label, widget: string, required: false, default: Learn more }
                  - { label: Link address, name: url, widget: string, required: false, hint: 'Paste the full address, starting with https://' }

  - name: bulletins
    label: Weekly Bulletin
    icon: description
    files:
      - name: items
        label: Bulletins
        file: content/bulletins.json
        description: The PDF bulletins listed on the Bulletin page.
        fields:
          - label: Bulletins
            name: items
            widget: list
            required: false
            label_singular: Bulletin
            summary: '{{fields.date}} — {{fields.title}}'
            collapsed: true
            fields:
              - label: Title
                name: title
                widget: string
                hint: For example "Sunday, 6 September 2026".

              - label: Date
                name: date
                widget: datetime
                format: 'YYYY-MM-DD'
                date_format: 'YYYY-MM-DD'
                time_format: false
                picker_utc: true

              - label: PDF
                name: file
                widget: file
                media_folder: /bulletins
                public_folder: /bulletins
                hint: Upload the bulletin PDF.

  # The strip of priests on the home page, oldest first.
  - name: priests
    label: Priests
    icon: person
    files:
      - name: items
        label: Priests
        file: content/priests.json
        description: The slow-moving strip of every priest who has served the parish, shown on the home page.
        fields:
          - label: Show the strip on the home page
            name: show
            widget: boolean
            required: false
            default: true
            hint: Turn this off to remove the strip from the home page. The list below is kept, so turning it back on restores everything.
          - label: Title above the strip
            name: heading
            widget: string
            required: false
          - label: Speed
            name: speed
            widget: select
            required: false
            default: normal
            options:
              - { label: Slow, value: slow }
              - { label: Normal, value: normal }
              - { label: Fast, value: fast }
            hint: How quickly the portraits drift past. Visitors can always pause it.
          - label: Priests
            name: items
            widget: list
            required: false
            label_singular: Priest
            summary: "{{fields.hidden | ternary('Hidden: ', '')}}{{fields.name}} ({{fields.years}})"
            collapsed: true
            hint: Listed oldest first. Drag to reorder.
            fields:
              - label: Name
                name: name
                widget: string
                hint: With the title, for example "Msgr. Sharbel Lischaa".

              - label: Years
                name: years
                widget: string
                required: false
                hint: For example "1974-2010" or "2020-Present".

              - label: Role
                name: role
                widget: string
                required: false
                hint: For example "Pastor", "Assistant Pastor", or "Administrator".

              - label: Photo
                name: image
                widget: image
                required: false
                media_folder: /images/priests
                public_folder: /images/priests
                hint: A head-and-shoulders photo works best. If left empty, a small cross is shown instead.

              - label: Hide from the strip
                name: hidden
                widget: boolean
                required: false
                default: false
                hint: Keeps this priest in the list without showing him on the site, for example while a photo or dates are being checked.

  # Colors and lettering, chosen from presets defined in app.js (PALETTES and
  # FONT_PAIRS). The values here must match the keys there.
  - name: design
    label: Design
    icon: palette
    files:
      - name: theme
        label: Colors & Fonts
        file: content/theme.json
        description: The look of the whole site. Changes apply everywhere at once.
        fields:
          - label: Color scheme
            name: palette
            widget: select
            required: false
            default: burgundy
            options:
              - { label: Burgundy & Gold (classic), value: burgundy }
              - { label: Cedar Green & Gold, value: cedar }
              - { label: Marian Blue & Gold, value: marian }
              - { label: Byzantine Plum & Gold, value: plum }
            hint: Every scheme keeps the gold accents and the light stone background.
          - label: Lettering
            name: fonts
            widget: select
            required: false
            default: marcellus
            options:
              - { label: Marcellus (classic), value: marcellus }
              - { label: Cinzel — Roman capitals, value: cinzel }
              - { label: Playfair — stately, value: playfair }
              - { label: Garamond — bookish, value: garamond }
            hint: The first font styles headings; each pairing includes a matching reading font.

  # Every heading, paragraph, time, photo, and link between the site's header
  # and footer. The field names are a contract with the data-cms attributes in
  # the HTML pages; renaming one here breaks the overlay in app.js.
  - name: pages
    label: Site Pages
    icon: web
    files:
      - name: home
        label: Home Page
        file: content/pages/home.json
        description: All the text on the home page, including Mass times.
        fields:
          - label: Top Banner
            name: hero
            widget: object
            required: false
            collapsed: true
            fields:
              - label: Small line above the title
                name: eyebrow
                widget: string
                required: false
              - label: Page title
                name: heading
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold or italic. The alignment button centers the title. Press Enter to split it over two lines.
              - label: Welcome paragraph
                name: lede
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
              - label: First button
                name: bulletinButton
                widget: string
                required: false
                hint: The button that opens the Weekly Bulletin page.
              - label: Second button
                name: visitButton
                widget: string
                required: false
                hint: The button that opens the Contact page.
          - label: Divine Liturgy Card
            name: liturgy
            widget: object
            required: false
            collapsed: true
            fields:
              - label: Card title
                name: heading
                widget: string
                required: false
              - label: Line under the title
                name: subtitle
                widget: string
                required: false
              - label: Liturgy times
                name: times
                widget: list
                required: false
                label_singular: Liturgy time
                summary: '{{fields.service}} — {{fields.time}}'
                hint: One row per service. Add rows for holy days, remove them after.
                fields:
                  - { label: Service, name: service, widget: string, hint: 'For example "Saturday Vigil" or "Sunday".', required: false }
                  - { label: Time, name: time, widget: string, hint: 'For example "4:00 PM".', required: false }
          - label: Our Parish
            name: parish
            widget: object
            required: false
            collapsed: true
            fields:
              - label: Small line above the title
                name: eyebrow
                widget: string
                required: false
              - label: Section title
                name: heading
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold or italic. The alignment button centers the title.
              - label: Photo
                name: photo
                widget: image
                required: false
              - label: Photo description
                name: photoAlt
                widget: string
                required: false
                hint: Describes the photo for people using a screen reader.
              - label: Caption under the photo
                name: caption
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
              - label: Parish story
                name: story
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: The history of the parish, in your own words.
              - label: Closing line
                name: storyMore
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
          - label: Extra Sections
            name: sections
            widget: list
            required: false
            label_singular: Section
            summary: '{{fields.heading | plain}}'
            collapsed: true
            hint: Add as many as you like and drag to reorder. They appear between "Our Parish" and the support banner.
            fields:
              - label: Layout
                name: layout
                widget: select
                required: false
                default: text
                options:
                  - { label: Text only, value: text }
                  - { label: Photo on the left, value: photo-left }
                  - { label: Photo on the right, value: photo-right }
                  - { label: Highlight banner, value: banner }
                hint: Photo layouts need a photo; the banner is a dark strip with a button, like the support banner.
              - label: Small line above the title
                name: eyebrow
                widget: string
                required: false
              - label: Title
                name: heading
                widget: string
                required: false
              - label: Text
                name: text
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
              - label: Photo
                name: image
                widget: image
                required: false
                hint: Used by the photo layouts.
              - label: Photo description
                name: imageAlt
                widget: string
                required: false
                hint: Describes the photo for people using a screen reader.
              - label: Buttons
                name: buttons
                widget: list
                required: false
                label_singular: Button
                summary: '{{fields.label}}'
                hint: Optional. The first button is gold; any others are outlined.
                fields:
                  - { label: Button text, name: label, widget: string, required: false }
                  - { label: Link address, name: url, widget: string, required: false, hint: 'Paste the full address starting with https://, or a page name like contact.html' }
          - label: Support Banner
            name: callout
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Title, name: heading, widget: string, required: false }
              - label: Text
                name: text
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
              - { label: Button, name: button, widget: string, hint: The button that opens the Donate page., required: false }

      - name: contact
        label: Contact Page
        file: content/pages/contact.json
        description: Phone, email, office hours, clergy, and directions.
        fields:
          - label: Page Heading
            name: header
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string, required: false }
              - { label: Page title, name: heading, widget: string, required: false }
              - label: Welcome paragraph
                name: lede
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
          - label: Parish Office
            name: office
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Box title, name: heading, widget: string, required: false }
              - label: Address
                name: address
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
              - label: Phone
                name: phone
                widget: string
                required: false
                hint: 'For example (215) 389-2000. The call link is made automatically.'
              - label: WhatsApp
                name: whatsapp
                widget: string
                required: false
                hint: The WhatsApp link is made automatically from the number.
              - { label: Email, name: email, widget: string, required: false }
              - { label: Office hours, name: hours, widget: string, required: false }
          - label: Clergy
            name: clergy
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Box title, name: heading, widget: string, required: false }
              - { label: Pastor, name: pastor, widget: string, required: false }
              - label: Sacraments text
                name: sacraments
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
              - label: New to the parish text
                name: newHere
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
          - label: Finding Us
            name: finding
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Box title, name: heading, widget: string, required: false }
              - label: Text
                name: text
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
              - label: Map address
                name: mapAddress
                widget: string
                required: false
                hint: The map and the "Get directions" link both point at this address.

      - name: donate
        label: Donate Page
        file: content/pages/donate.json
        description: The giving options and their links.
        fields:
          - label: Page Heading
            name: header
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string, required: false }
              - { label: Page title, name: heading, widget: string, required: false }
              - label: Welcome paragraph
                name: lede
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
          - label: Zeffy Card
            name: zeffy
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Card title, name: heading, widget: string, required: false }
              - label: Text
                name: text
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
              - { label: Button, name: button, widget: string, required: false }
              - { label: Donation link, name: url, widget: string, hint: 'Paste the full address, starting with https://', required: false }
          - label: Venmo Card
            name: venmo
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Card title, name: heading, widget: string, required: false }
              - label: Text
                name: text
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
              - { label: Button, name: button, widget: string, required: false }
              - { label: Donation link, name: url, widget: string, hint: 'Paste the full address, starting with https://', required: false }

      - name: news-page
        label: News Page
        file: content/pages/news.json
        description: The heading above the list of news items.
        fields:
          - label: Page Heading
            name: header
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string, required: false }
              - { label: Page title, name: heading, widget: string, required: false }
              - label: Welcome paragraph
                name: lede
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.

      - name: bulletin-page
        label: Bulletin Page
        file: content/pages/bulletin.json
        description: The heading above the list of bulletins.
        fields:
          - label: Page Heading
            name: header
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Small line above the title, name: eyebrow, widget: string, required: false }
              - { label: Page title, name: heading, widget: string, required: false }
              - label: Welcome paragraph
                name: lede
                widget: richtext
                format: html
                modes: [rich_text]
                buttons: [bold, italic, link, bulleted-list, numbered-list, align]
                editor_components: []
                required: false
                hint: Select some words to make them bold, italic, or a link. The alignment button centers or justifies a paragraph.
          - label: Older bulletins note
            name: olderNote
            widget: richtext
            format: html
            modes: [rich_text]
            buttons: [bold, italic, link, bulleted-list, numbered-list, align]
            editor_components: []
            required: false
            hint: The italic line under the list of bulletins.
